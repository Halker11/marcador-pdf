[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marcador-pdf"
version = "0.1.0"
description = "Marcações de revisão em PDF no padrão do Adobe Acrobat, gravadas por código"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Silvia Gonçalves Silva" }]
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
marcador-pdf = "marcador_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
